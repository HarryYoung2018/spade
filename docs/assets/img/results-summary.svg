<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" role="img" aria-labelledby="title desc">
  <title id="title">SPADE results summary</title>
  <desc id="desc">Compact visual summary of SPADE rank and top-task metrics.</desc>
  <rect width="900" height="280" rx="18" fill="#ffffff"/>
  <g font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="42" y="52" fill="#132b56" font-size="24" font-weight="800">Results snapshot</text>
    <g transform="translate(44 92)">
      <rect width="150" height="116" rx="12" fill="#eaf0ff" stroke="#b9c8ee"/>
      <text x="75" y="36" text-anchor="middle" fill="#5f6f8a" font-size="13" font-weight="700">Mean rank</text>
      <text x="75" y="72" text-anchor="middle" fill="#132b56" font-size="31" font-weight="850">2.8/24</text>
      <text x="75" y="96" text-anchor="middle" fill="#5f6f8a" font-size="12">max score</text>
    </g>
    <g transform="translate(224 92)">
      <rect width="150" height="116" rx="12" fill="#ffffff" stroke="#d9e1ee"/>
      <text x="75" y="36" text-anchor="middle" fill="#5f6f8a" font-size="13" font-weight="700">Median rank</text>
      <text x="75" y="72" text-anchor="middle" fill="#132b56" font-size="31" font-weight="850">1.5/24</text>
      <text x="75" y="96" text-anchor="middle" fill="#5f6f8a" font-size="12">max score</text>
    </g>
    <g transform="translate(404 92)">
      <rect width="150" height="116" rx="12" fill="#fff1ed" stroke="#efc9c0"/>
      <text x="75" y="36" text-anchor="middle" fill="#5f6f8a" font-size="13" font-weight="700">Top-2 tasks</text>
      <text x="75" y="72" text-anchor="middle" fill="#132b56" font-size="31" font-weight="850">5/6</text>
      <text x="75" y="96" text-anchor="middle" fill="#5f6f8a" font-size="12">benchmarks</text>
    </g>
    <g transform="translate(604 94)">
      <text x="0" y="16" fill="#132b56" font-size="15" font-weight="800">Normalized max score</text>
      <rect x="0" y="40" width="220" height="12" rx="6" fill="#e5ebf5"/>
      <rect x="0" y="40" width="188" height="12" rx="6" fill="#3157a4"/>
      <text x="0" y="82" fill="#132b56" font-size="15" font-weight="800">Median-score robustness</text>
      <rect x="0" y="106" width="220" height="12" rx="6" fill="#e5ebf5"/>
      <rect x="0" y="106" width="202" height="12" rx="6" fill="#b94f3b"/>
    </g>
  </g>
</svg>
