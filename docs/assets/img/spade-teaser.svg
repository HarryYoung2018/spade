<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
  <title id="title">SPADE teaser</title>
  <desc id="desc">Pipeline from offline data to calibrated diffusion, support proximity, conservative acquisition, and optimized design.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#edf3ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#142749" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="920" height="560" rx="24" fill="url(#bg)"/>
  <g transform="translate(54 62)" filter="url(#shadow)">
    <rect width="812" height="436" rx="20" fill="#fff" stroke="#d9e1ee"/>
  </g>
  <g font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="92" y="122" fill="#132b56" font-size="32" font-weight="800">SPADE</text>
    <text x="92" y="154" fill="#5f6f8a" font-size="16">Support-aware conditional diffusion for offline BBO</text>
    <g transform="translate(92 220)">
      <rect width="132" height="86" rx="12" fill="#eaf0ff" stroke="#b9c8ee"/>
      <text x="66" y="38" text-anchor="middle" fill="#132b56" font-size="15" font-weight="800">Offline</text>
      <text x="66" y="60" text-anchor="middle" fill="#132b56" font-size="15" font-weight="800">data</text>
      <circle cx="34" cy="24" r="5" fill="#3157a4"/>
      <circle cx="94" cy="64" r="5" fill="#b94f3b"/>
      <circle cx="74" cy="30" r="4" fill="#3157a4"/>
    </g>
    <g transform="translate(270 220)">
      <rect width="164" height="86" rx="12" fill="#fff" stroke="#d9e1ee"/>
      <text x="82" y="34" text-anchor="middle" fill="#132b56" font-size="15" font-weight="800">Conditional</text>
      <text x="82" y="57" text-anchor="middle" fill="#132b56" font-size="15" font-weight="800">diffusion p(y|x)</text>
    </g>
    <g transform="translate(480 220)">
      <rect width="132" height="86" rx="12" fill="#fff" stroke="#d9e1ee"/>
      <text x="66" y="38" text-anchor="middle" fill="#132b56" font-size="15" font-weight="800">Calibration</text>
      <text x="66" y="60" text-anchor="middle" fill="#5f6f8a" font-size="13">moment + rank</text>
    </g>
    <g transform="translate(658 220)">
      <rect width="150" height="86" rx="12" fill="#fff1ed" stroke="#efc9c0"/>
      <text x="75" y="36" text-anchor="middle" fill="#132b56" font-size="15" font-weight="800">Support</text>
      <text x="75" y="58" text-anchor="middle" fill="#132b56" font-size="15" font-weight="800">proximity</text>
    </g>
    <g fill="none" stroke="#3157a4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M232 263h28"/>
      <path d="M424 263h46"/>
      <path d="M602 263h46"/>
      <path d="M258 254l12 9-12 9"/>
      <path d="M468 254l12 9-12 9"/>
      <path d="M646 254l12 9-12 9"/>
    </g>
    <g transform="translate(246 374)">
      <rect width="430" height="54" rx="12" fill="#132b56"/>
      <text x="215" y="35" text-anchor="middle" fill="#fff" font-size="17" font-weight="800">Conservative LCB acquisition -> optimized design</text>
    </g>
  </g>
</svg>
